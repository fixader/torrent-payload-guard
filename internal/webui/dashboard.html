<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torrent Payload Guard</title>
<style>
:root{color-scheme:dark;--bg:#07100d;--panel:#101b17;--line:#25352e;--text:#eaf5ef;--muted:#91a69c;--green:#52d99a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#17392d 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
nav{height:58px;border-bottom:1px solid var(--line);background:rgba(7,16,13,.92);display:flex;align-items:center;padding:0 max(16px,calc((100% - 1180px)/2));gap:8px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}nav .brand{font-weight:850;margin-right:auto;color:var(--text);text-decoration:none}nav a:not(.brand){color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:9px}nav a.active{color:var(--bg);background:var(--green)}
main{width:min(1180px,calc(100% - 32px));margin:34px auto}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0 0 10px;letter-spacing:-.04em}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.sub{color:var(--muted);margin:0}a{color:var(--green)}
.live{border:1px solid var(--line);background:#0b1612;padding:9px 13px;border-radius:999px;white-space:nowrap;display:inline-block;margin-left:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:32px 0}.card,.table-wrap{background:rgba(16,27,23,.94);border:1px solid var(--line);border-radius:16px}.card{padding:18px}.label{color:var(--muted);font-size:12px;text-transform:uppercase}.value{font-size:29px;font-weight:750}
.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.filters{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:var(--muted);background:#0c1713;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}button.active{color:var(--bg);background:var(--green)}.mode{color:var(--muted);font-family:monospace}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}.name{font-weight:650}.small{font-size:12px;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;text-transform:uppercase}.dangerous{color:#ffdada;background:#4e1f25}.suspicious{color:#ffe3aa;background:#46351b}.ok{color:#bdf4da;background:#153a2b}.files{color:#ffaaa8;font:12px monospace;word-break:break-word}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:760px){main{margin:24px auto}.top{display:block}.top>div:last-child{margin-top:18px}.cards{grid-template-columns:repeat(2,1fr)}.controls{align-items:flex-start;flex-direction:column}}
</style></head><body>
<nav><a class="brand" href="/">Torrent Payload Guard</a><a class="active" href="/">Dashboard</a><a href="/settings">Settings</a></nav>
<main>
<div class="top"><div><div class="eyebrow">Payload security service</div><h1>Torrent Payload Guard</h1><p class="sub">Actual files. Clear actions. No trust in release titles.</p></div><div class="live"><span class="dot"></span><span id="health">connecting…</span></div></div>
<section class="cards"><div class="card"><div class="label">Scanned</div><div class="value" id="scanned">—</div></div><div class="card"><div class="label">Dangerous</div><div class="value" id="dangerous">—</div></div><div class="card"><div class="label">Suspicious</div><div class="value" id="suspicious">—</div></div><div class="card"><div class="label">qBit actions</div><div class="value" id="actions">—</div></div></section>
<div class="controls"><div class="filters"><button class="active" data-filter="all">All</button><button data-filter="dangerous">Dangerous</button><button data-filter="suspicious">Suspicious</button><button data-filter="ok">OK</button></div><div class="mode" id="mode"></div></div>
<div class="table-wrap"><table><thead><tr><th>Status</th><th>Torrent</th><th>Dangerous files</th><th>Action</th><th>Report</th><th>Last seen</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>No torrents match this filter.</div></div>
</main><script>
let events=[],filter='all';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const shown=events.filter(e=>filter==='all'||e.PayloadStatus===filter);$('#rows').innerHTML=shown.map(e=>`<tr><td><span class="badge ${esc(e.PayloadStatus)}">${esc(e.PayloadStatus)}</span></td><td><div class="name">${esc(e.Name)}</div><div class="small">${esc(e.Category||'uncategorized')} · ${esc(e.Hash.slice(0,10))}…</div></td><td class="files">${esc((e.DangerousFiles||[]).join(' · ')||'—')}</td><td>${esc(e.ActionTaken||'—')}</td><td>${esc(e.ReportedTo||'none')}<div class="small">${esc(e.ReportStatus||'—')}</div></td><td class="small">${esc(new Date(e.LastSeenAt).toLocaleString('en-GB'))}</td></tr>`).join('');$('#empty').hidden=shown.length>0}
async function refresh(){try{const [s,e]=await Promise.all([fetch('/status').then(r=>r.json()),fetch('/api/torrents').then(r=>r.json())]);events=e;$('#health').textContent='active';$('#scanned').textContent=s.counters.torrents_scanned;$('#dangerous').textContent=s.counters.dangerous_detected;$('#suspicious').textContent=s.counters.suspicious_detected;$('#actions').textContent=s.counters.qbit_actions_taken;$('#mode').textContent=`${s.action_mode} · dry-run ${s.dry_run?'on':'off'}`;render()}catch(_){$('#health').textContent='unavailable'}}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('.active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});refresh();setInterval(refresh,10000);
</script></body></html>
