services:
  torrentguard:
    image: ghcr.io/fixader/torrent-payload-guard:latest
    container_name: torrentguard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME: ${QBIT_USERNAME:-}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
      QBIT_API_KEY: ${QBIT_API_KEY:-}
      QBIT_AUTH_MODE: ${QBIT_AUTH_MODE:-auto}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      ACTION_MODE: ${ACTION_MODE:-observe}
      DRY_RUN: ${DRY_RUN:-true}
      DELETE_DATA: ${DELETE_DATA:-false}
      PAUSE_UNMAPPED: ${PAUSE_UNMAPPED:-true}
      SONARR_CATEGORIES: ${SONARR_CATEGORIES:-sonarr}
      RADARR_CATEGORIES: ${RADARR_CATEGORIES:-radarr}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-}
      SETTINGS_PATH: /data/settings.json
      DANGEROUS_EXTENSIONS: ${DANGEROUS_EXTENSIONS:-.exe,.scr,.bat,.cmd,.com,.msi,.msp,.ps1,.psm1,.vbs,.vbe,.js,.jse,.wsf,.wsh,.hta,.lnk,.jar,.reg,.dll,.apk}
    volumes:
      - torrentguard-data:/data
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  torrentguard-data:
